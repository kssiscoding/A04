<!DOCTYPE html>
<!--Tells the file that this is HTML5-->
<html lang ="en">
    <!--opens the html document and establishes
     english as the language-->
     <head>
        <!--opens the heading using semantic html-->
        <meta charset="UTF-8">
        <!--sets basic character rules so text displays correctly-->
        <meta name="viewport" content = "width=device-width, intial-scale=1.0">
        <!--makes the website scalable to devices. works perfectly fine on laptop and mobile-->
        <title> My-first-web-page</title>     
        <!--sets the title of the page in the browser tab-->
    </head>
    <!--closes header section-->
    <body>
        <!--Starts the body section using semantic html-->
        <main>
            <!--starts the main section, is necessary because we have footer-->
            <p><strong>Name: </strong> Kumpal Shah </p>
            <!--bolds the name sections and declares a paragraph to help seperate elements. declares my name-->
            <p><strong>Course name: </strong>Introduction to Website Development</p>
            <!--bolds course name and declares the paragraph element-->
            <p><strong>Course Section and #: </strong> IS117 Section 003  </p>
            <!--bolds the course section and # and declares a paragraph element-->
        </main>
        <!--closes the main section-->
        <footer>
            <!--starts the footer section using semantic html-->
            <p>&copy; Kumpal Shah || October 10, 2026</p>
            <!--delcares a paragraph element and the &copy creates a copyright symbol-->
        </footer>
        <!--ends the footer section-->
    </body>
    <!--ends body section-->    
</html>
<!--ends the html-->
